[pytest]
pythonpath = .
testpaths = tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

addopts =
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --clean-alluredir
    --strict-markers

markers =
    api: API接口自动化测试
    ui: UI界面自动化测试
    db: 数据库校验测试